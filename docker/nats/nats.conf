# Development NATS server.
#
# Deliberately configured with ALL THREE telemetry sources on, so the dev
# environment exercises the happy path of the provenance model rather than only
# the degraded one:
#   - the client protocol            (always available)
#   - the HTTP monitoring port       (http_port below)
#   - the $SYS account               (system_account below)
#
# docker/nats/nats-bare.conf is the same server with monitoring and $SYS removed;
# the integration suite runs both so the honest empty state is a test, not a promise.

server_name: nats-dev
listen: 0.0.0.0:4222
http_port: 8222

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 1GB
  max_file_store: 10GB
}

accounts {
  SYS: {
    users: [{ user: "sys", password: "sys" }]
  }
  APP: {
    jetstream: enabled
    users: [{ user: "app", password: "app" }]
  }
}

system_account: SYS

# A slow consumer is disconnected rather than allowed to stall the server.
# Kept small in dev so the Monitor screen's slow-consumer counter is reachable.
write_deadline: "2s"
max_pending: 8MB
